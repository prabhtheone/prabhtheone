name: Generate GitHub metrics

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate 3D isometric contribution calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: main
          committer_message: "chore: update 3D contribution calendar [Skip GitHub Action]"
          output_action: commit
          filename: github-isometric.svg
          config_display: large
          config_padding: 6%
          config_timezone: Asia/Kolkata
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

      - name: Generate GitHub metrics dashboard
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: main
          committer_message: "chore: update GitHub metrics [Skip GitHub Action]"
          output_action: commit
          filename: github-metrics.svg
          config_display: large
          config_padding: 8%
          config_timezone: Asia/Kolkata
          base: header, activity, community, repositories, metadata
          plugin_languages: yes
          plugin_languages_limit: 5
          plugin_languages_details: percentage
          plugin_habits: yes
          plugin_habits_from: 100
          plugin_lines: yes
          plugin_topics: yes
          plugin_topics_sort: stars
          plugin_topics_limit: 10
