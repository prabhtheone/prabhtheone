name: Update profile artwork

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile-art
  cancel-in-progress: false

jobs:
  profile-art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install renderer dependencies
        run: python -m pip install -r scripts/requirements.txt
      - name: Refresh daily contribution data
        run: python scripts/fetch_contributions.py
      - name: Render existing animated contribution heatmap
        run: python scripts/render_heatmap_svg.py
      - name: Render animated profile card stack
        run: python scripts/render_profile_cards.py
      - name: Rebase generated files onto the latest main
        run: git pull --rebase --autostash origin main
      - name: Commit refreshed artwork
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh animated profile cards [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg cards/*.svg"
