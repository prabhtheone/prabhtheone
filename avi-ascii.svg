<svg xmlns="http://www.w3.org/2000/svg" width="380" height="390" viewBox="0 0 380 390" role="img" aria-labelledby="title desc"><title id="title">ASCII portrait placeholder</title><desc id="desc">Waiting for a clear photo to generate the animated ASCII portrait.</desc><style>.m{font-family:ui-monospace,monospace;fill:#94a3b8}.g{fill:#86efac;font-family:ui-monospace,monospace}.p{opacity:0;animation:typing .5s ease-out forwards}.p1{animation-delay:.2s}.p2{animation-delay:.5s}.p3{animation-delay:.8s}.p4{animation-delay:1.1s}.p5{animation-delay:1.4s}@keyframes typing{to{opacity:1}}</style><rect x="1" y="1" width="378" height="388" rx="14" fill="#101820" stroke="#334155" stroke-width="2"/><text x="22" y="34" class="g" font-size="13">$ ./portrait.sh</text><g text-anchor="middle" class="g" font-size="12"><text x="190" y="113" class="p p1">┌──────────────────────────┐</text><text x="190" y="139" class="p p2">│                          │</text><text x="190" y="165" class="p p3">│     PORTRAIT PENDING     │</text><text x="190" y="191" class="p p4">│                          │</text><text x="190" y="217" class="p p5">└──────────────────────────┘</text></g><text x="190" y="270" text-anchor="middle" class="m" font-size="12">Add a clear front-facing photo</text><text x="190" y="291" text-anchor="middle" class="m" font-size="12">to generate the animated ASCII art.</text><text x="22" y="360" class="g" font-size="12">prabhjot@github:~$ _</text></svg>